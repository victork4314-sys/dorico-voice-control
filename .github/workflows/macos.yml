name: macOS build and tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest stable Xcode
        run: bash scripts/select-latest-xcode.sh
      - name: Verify source safety rails
        run: bash scripts/verify-source-safety.sh
      - name: Test core and compile native app
        run: swift test
      - name: Build universal app, ZIP, and DMG
        env:
          VERSION: 0.1.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh
      - name: Upload universal installer
        uses: actions/upload-artifact@v4
        with:
          name: DoricoVoiceControl-macOS-Universal
          path: |
            dist/Dorico-Voice-Control-macOS-Universal.dmg
            dist/Dorico-Voice-Control-macOS-Universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
