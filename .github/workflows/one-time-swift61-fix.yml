name: One-time Swift 6.1 source fix

on:
  push:
    branches: [agent/build-separate-voice-app]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-separate-voice-app
      - name: Split expensive type-check expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Sources/DoricoVoiceCore/DoricoVoiceLanguage.swift')
          text = path.read_text()
          old = '''        let scored = directCommands.map { (similarity(phrase, $0.key), $0.key, $0.value) }
              .sorted { lhs, rhs in lhs.0 == rhs.0 ? lhs.1.count < rhs.1.count : lhs.0 > rhs.0 }
          '''
          new = '''        typealias DirectScore = (score: Double, phrase: String, command: DoricoVoiceCommand)
          var scored: [DirectScore] = []
          scored.reserveCapacity(directCommands.count)
          for (candidatePhrase, candidateCommand) in directCommands {
              let score = similarity(phrase, candidatePhrase)
              scored.append((score: score, phrase: candidatePhrase, command: candidateCommand))
          }
          scored.sort { lhs, rhs in
              if lhs.score == rhs.score { return lhs.phrase.count < rhs.phrase.count }
              return lhs.score > rhs.score
          }
          '''
          if old not in text:
              raise SystemExit('Expected Swift expression not found')
          text = text.replace(old, new)
          text = text.replace('guard best.0 >= threshold else { return nil }', 'guard best.score >= threshold else { return nil }')
          text = text.replace('second.2.canonicalPhrase != best.2.canonicalPhrase,\n             best.0 - second.0 < 0.045', 'second.command.canonicalPhrase != best.command.canonicalPhrase,\n             best.score - second.score < 0.045')
          text = text.replace('var command = best.2\n          command.confidence = best.0', 'var command = best.command\n          command.confidence = best.score')
          path.write_text(text)
          PY
          rm .github/workflows/one-time-swift61-fix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Sources/DoricoVoiceCore/DoricoVoiceLanguage.swift .github/workflows/one-time-swift61-fix.yml
          git commit -m "Fix Swift 6.1 parser type checking"
          git push origin HEAD:agent/build-separate-voice-app
