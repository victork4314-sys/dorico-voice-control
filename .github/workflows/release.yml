name: Release Dorico Voice Control

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          bash scripts/build-app.sh
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Dorico-Voice-Control-macOS-Universal.dmg
            dist/Dorico-Voice-Control-macOS-Universal.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
